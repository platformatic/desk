version: 4

description: |
  Skew protection testing profile. ICC manages HTTPRoute rules for
  version-aware request routing via Envoy Gateway. ICC, Machinist, and
  Workflow run with hot reload from local repositories.

cluster:
  namespaces:
    - platformatic

  k3d:
    nodes: 1

dependencies:
  prometheus-community/prometheus-adapter:
    plt_defaults: true
  prometheus-community/kube-prometheus-stack:
    plt_defaults: true
  cloudpirates/postgres:
    plt_defaults: true
  cloudpirates/valkey:
    plt_defaults: true

platformatic:
  services:
    icc:
      hotReload: true
      localRepo: "{{ ICC_REPO }}"

      resources:
        limits:
          memory: "4Gi"
          cpu: "2"
        requests:
          memory: "2Gi"
          cpu: "2"

      features:
        cache:
          enable: true
        cache_recommendations:
          enable: false
        risk_service_dump:
          enable: false
        ffc:
          enable: false
        deployer:
          enable: true                     # ICC creates workloads via the deploy API (grants create/patch on Deployments/Services/pull Secrets)
        skew_protection:
          enable: true
          auto_cleanup: false              # Keep expired Deployments/Services for inspection
          http_grace_period_ms: 120000     # 2 min: keep >= traffic_window_ms
          http_max_alive_ms: 900000         # 15 min for e2e testing
          workflow_grace_period_ms: 300000  # 5 min for demo
          workflow_max_alive_ms: 900000    # 15 min for demo
          check_interval_ms: 10000         # 10 seconds
          traffic_window_ms: 60000         # 1 min
          cookie_max_age: 43200            # 12h in seconds (keep default)
          default_routing_mode: query       # query | cookie; per-app override in ICC settings
        icc_jobs:
          enable: true

      login_methods:
        google:
          enable: false
          client_id: ""
          client_secret: ""
          valid_emails: ""
        github:
          enable: true
          client_id: "{{ GITHUB_OAUTH_CLIENT_ID }}"
          client_secret: "{{ GITHUB_OAUTH_CLIENT_SECRET }}"
          valid_emails: "{{ GITHUB_OAUTH_VALID_EMAILS }}"

      log_level: info

      secrets:
        icc_session: "nqS4bQDlFNZfd1PtLwbkCDEgJiozzxRuyslNPtSSdeQ="
        control_plane_keys: "iUIz122f2Kh49Q2PvGxJWuajJRm8B0TZ7orfGbf29LA="
        user_manager_session: "XnlPIbATw2x/7xIX304esO9qKuCZLR3HOa8wTF6O3pc="

      scaler:
        algorithm_version: "v1"

    machinist:
      hotReload: true
      localRepo: "{{ MACHINIST_REPO }}"

      features:
        event_export:
          enable: false

      log_level: debug

    workflow:
      hotReload: true
      localRepo: "{{ WORKFLOW_REPO }}"
      workingDir: /app/packages/workflow

      replicas:
        min: 1
        max: 1

      log_level: info
