version: 4

description: |
  This configuration installs the OSS versions of ICC and Machinist.

# Define the cluster provider and any relevant details
# When the cluster is created, it will be named after this file: plt-example
cluster:
  namespaces:
    - platformatic

  # This is the cluster provider key
  k3d:
    nodes: 1

# Define the charts to be installed in your cluster
dependencies:
  prometheus-community/prometheus-adapter:
    # When set to false, the _overrides.yaml_ file in the chart directory is
    # ignored
    plt_defaults: true
  prometheus-community/kube-prometheus-stack:
    plt_defaults: true
  cloudpirates/postgres:
    plt_defaults: true
  cloudpirates/valkey:
    plt_defaults: true
  # Uncomment to enable Kafka (optional)
  # local/kafka:
  #   plt_defaults: true

# Define what Platformatic applications to deploy and where they are sourced from
# This matches the v4 Helm chart values.yaml
platformatic:
  imagePullSecret:
    registry: docker.io
    user: "{{ PULL_SECRET_USER }}"
    token: "{{ PULL_SECRET_TOKEN }}"

  services:
    icc:
      # Remote image through local registry cache
      image:
        tag: "v3.6.0"
        repository: "platformatic/intelligent-command-center"

      resources:
        limits:
          memory: "4Gi"
          cpu: "2"
        requests:
          memory: "2Gi"
          cpu: "2"

      features:
        cache_recommendations:
          enable: false
        risk_service_dump:
          enable: false
        ffc:
          enable: false
        skew_protection:
          enable: true
          auto_cleanup: false              # Keep expired Deployments/Services for inspection
          http_grace_period_ms: 30000      # 30s for e2e testing
          http_max_alive_ms: 180000        # 3 min for e2e testing
          workflow_grace_period_ms: 300000  # 5 min for demo
          workflow_max_alive_ms: 900000    # 15 min for demo
          check_interval_ms: 10000         # 10 seconds
          traffic_window_ms: 30000         # 30 seconds for e2e testing
          cookie_max_age: 43200            # 12h in seconds (keep default)
          default_routing_mode: query       # query | cookie; per-app override in ICC settings
        icc_jobs:
          enable: true

      # Matches the login methods available in our Helm chart
      # If no method is enabled, `login_methods.demo` will be enabled.
      login_methods:
        google:
          enable: false
          client_id: ""
          client_secret: ""
          valid_emails: ""
        github:
          enable: true
          client_id: "{{ GITHUB_OAUTH_CLIENT_ID }}"
          client_secret: "{{ GITHUB_OAUTH_CLIENT_SECRET }}"
          valid_emails: "{{ GITHUB_OAUTH_VALID_EMAILS }}"

      # Set the ICC log level
      log_level: info

      # In production, these would be randomly and secretly generated
      secrets:
        icc_session: "nqS4bQDlFNZfd1PtLwbkCDEgJiozzxRuyslNPtSSdeQ="
        control_plane_keys: "iUIz122f2Kh49Q2PvGxJWuajJRm8B0TZ7orfGbf29LA="
        user_manager_session: "XnlPIbATw2x/7xIX304esO9qKuCZLR3HOa8wTF6O3pc="

    machinist:
      image:
        tag: "v2.1.1"
        repository: "platformatic/machinist"

      features:
        event_export:
          enable: false

      log_level: info

    workflow:
      image:
        tag: "0.7.1"
        repository: "platformatic/workflow"

      log_level: info
